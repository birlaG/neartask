version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: neartask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neartask
      POSTGRES_PASSWORD: neartask_dev_password
      POSTGRES_DB: neartask
    ports:
      - "5432:5432"
    volumes:
      - neartask_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neartask-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: neartask-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  neartask_pg_data:
